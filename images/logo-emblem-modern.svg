<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <!-- Gradients -->
    <linearGradient id="sunGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FBBF24" />
      <stop offset="60%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>
    <linearGradient id="waveLight" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>
    <linearGradient id="waveDark" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284C7" />
      <stop offset="100%" stop-color="#0A192F" />
    </linearGradient>
    <linearGradient id="pirogueWood" x1="0%" y1="0%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#B45309" />
      <stop offset="100%" stop-color="#78350F" />
    </linearGradient>
    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.15" />
    </filter>
  </defs>

  <!-- Sun Circle -->
  <circle cx="70" cy="50" r="32" fill="url(#sunGrad)" filter="url(#subtleGlow)" />

  <!-- Sun Rays Accent Arc -->
  <path d="M 40,32 A 40,40 0 0 1 98,68" fill="none" stroke="#FBBF24" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="2 6" opacity="0.7" />

  <!-- Birds in Sky -->
  <path d="M 54,26 Q 58,23 62,26 Q 66,23 70,26" fill="none" stroke="#0F172A" stroke-width="1.8" stroke-linecap="round" />
  <path d="M 72,34 Q 75,31 78,34 Q 81,31 84,34" fill="none" stroke="#0F172A" stroke-width="1.4" stroke-linecap="round" />

  <!-- Stylized Palm Tree (Nature / Discovery) -->
  <!-- Trunk -->
  <path d="M 38,76 Q 37,56 46,40 Q 43,56 42,76 Z" fill="#0D5C3A" />
  <!-- Palm Fronds -->
  <path d="M 46,40 Q 30,34 22,44 C 30,41 38,44 46,40 Z" fill="#059669" />
  <path d="M 46,40 Q 36,25 28,26 C 36,29 42,34 46,40 Z" fill="#10B981" />
  <path d="M 46,40 Q 48,22 56,22 C 54,28 50,34 46,40 Z" fill="#059669" />
  <path d="M 46,40 Q 60,26 66,32 C 60,34 54,37 46,40 Z" fill="#10B981" />
  <path d="M 46,40 Q 64,38 68,46 C 60,45 52,43 46,40 Z" fill="#047857" />

  <!-- Island / Monument silhouette on horizon -->
  <path d="M 82,68 C 84,62 88,61 92,63 C 94,57 98,59 100,68 Z" fill="#78350F" opacity="0.6" />

  <!-- Ocean Waves (Base) -->
  <path d="M 8,82 C 26,76 44,86 64,80 C 84,74 100,82 112,80 L 112,96 C 96,96 76,98 56,98 C 36,98 18,94 8,96 Z" fill="url(#waveLight)" opacity="0.85" />
  <path d="M 6,88 C 28,82 48,92 70,86 C 90,80 106,86 114,84 L 114,106 C 94,106 74,108 54,108 C 34,108 16,106 6,106 Z" fill="url(#waveDark)" />

  <!-- Traditional Senegalese Pirogue Boat -->
  <!-- Boat Body -->
  <path d="M 16,77 C 32,86 78,86 96,73 C 86,81 40,83 24,79 Z" fill="url(#pirogueWood)" />
  <path d="M 16,77 C 34,84 76,84 94,74 L 96,72 C 78,80 34,80 18,74 Z" fill="#F59E0B" />
  <!-- Senegalese Flag Stripes on Pirogue side -->
  <path d="M 32,78 L 44,79 L 43,81 L 31,80 Z" fill="#059669" />
  <path d="M 44,79 L 56,79.5 L 55,81.5 L 43,81 Z" fill="#FBBF24" />
  <path d="M 56,79.5 L 68,79 L 67,81 L 55,81.5 Z" fill="#DC2626" />
  <!-- Star on Pirogue Flag -->
  <polygon points="50,79.2 50.8,80.5 49.5,79.7 50.5,79.7 49.2,80.5" fill="#059669" />

  <!-- Dynamic Foreground Foam Wave -->
  <path d="M 12,94 C 28,89 44,95 62,91 C 80,87 96,92 108,90" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" opacity="0.9" />
  <path d="M 22,99 C 38,96 52,100 68,97 C 82,94 94,98 104,96" fill="none" stroke="#38BDF8" stroke-width="1.5" stroke-linecap="round" opacity="0.75" />
</svg>
